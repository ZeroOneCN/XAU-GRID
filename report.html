<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-mode="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="favicon.png">
<title>XAU Grid 交易日报 · 文字版</title>
<script>
(function(){
  try{
    var m = localStorage.getItem('xau-grid-theme') || 'auto';
    var light = m === 'light' || (m === 'auto' && window.matchMedia('(prefers-color-scheme: light)').matches);
    document.documentElement.setAttribute('data-mode', m);
    document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
  }catch(e){}
})();
</script>
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/report.css">
<link rel="stylesheet" href="assets/css/theme-control.css">
<!-- 静态托管标记：publish.py 会把下一行替换为 window.__XAU_STATIC__ = true; -->
<script>window.__XAU_STATIC__ = true;  // publish.py: 静态托管强制静态模式</script>
</head>
<body>
<div class="report-shell">
  <header class="report-bar">
    <div class="rb-brand">
      <div class="rb-logo" aria-label="XAU GRID 黄金金库图标">
        <svg viewBox="0 0 1408 1024" role="img" aria-hidden="true">
          <defs>
            <linearGradient id="goldFillReport" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="var(--logo-1)"/><stop offset=".5" stop-color="var(--logo-2)"/><stop offset="1" stop-color="var(--logo-3)"/>
            </linearGradient>
          </defs>
          <path d="M149.83552 896H192.07552a64 64 0 0 1 0 128H64.07552a64 64 0 0 1-61.376-82.176l132.672-448A64 64 0 0 1 196.74752 448h374.656a64 64 0 0 1 61.376 45.824l132.672 448A64 64 0 0 1 704.07552 1024H448.07552a64 64 0 0 1 0-128h170.24L523.59552 576H244.55552l-94.72 320z" fill="url(#goldFillReport)"/>
          <path d="M789.83552 896h468.48l-94.72-320h-279.04l-94.72 320z m46.912-448h374.656a64 64 0 0 1 61.376 45.824l132.672 448A64 64 0 0 1 1344.07552 1024H704.07552a64 64 0 0 1-61.376-82.176l132.672-448A64 64 0 0 1 836.74752 448z" fill="url(#goldFillReport)"/>
          <path d="M564.55552 128L469.83552 448h468.48l-94.72-320H564.55552z m-47.808-128h374.656a64 64 0 0 1 61.376 45.824l132.672 448A64 64 0 0 1 1024.07552 576H384.07552a64 64 0 0 1-61.376-82.176l132.672-448A64 64 0 0 1 516.74752 0z" fill="url(#goldFillReport)"/>
        </svg>
      </div>
      <div class="rb-title">
        <b>XAU GRID</b>
        <small>DAILY REPORT / XAUUSD GRID</small>
      </div>
    </div>

    <div class="rb-meta">
      <span class="rb-status"><i class="dot"></i>REPORT · 文字版日报</span>
    </div>

    <div class="rb-actions">
      <!-- 主题切换：与看板完全相同的控件与逻辑（auto / light / dark） -->
      <button class="theme" id="themeToggle" data-mode="auto" title="主题：跟随系统（点击切换）" aria-label="主题切换">
        <i class="theme-lamp"></i><span class="theme-word"></span>
      </button>

      <div class="datepick" id="datePick">
        <button type="button" class="dp-trigger" id="dateBtn" title="选择有数据的交易日"
                aria-haspopup="dialog" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></svg>
          <span id="dateLabel">载入日期…</span><span class="caret">▾</span>
        </button>
        <div class="dp-panel" id="dpPanel" role="dialog" aria-label="选择交易日" hidden>
          <div class="dp-head">
            <button type="button" class="dp-nav" id="dpPrev" aria-label="上个月">‹</button>
            <strong id="dpMonth"></strong>
            <button type="button" class="dp-nav" id="dpNext" aria-label="下个月">›</button>
          </div>
          <div class="dp-week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
          <div class="dp-grid" id="dpGrid"></div>
          <div class="dp-foot"><small>灰色日期无平仓数据</small>
            <button type="button" class="dp-latest" id="dpLatest">最新有数据日</button></div>
        </div>
      </div>
      <button id="goBtn">查看</button>
      <button id="copyBtn">复制全文</button>
      <button id="dlBtn">下载 .md</button>
      <a class="btn" href="index.html">返回看板</a>
    </div>
  </header>

  <main class="report-main">
    <div class="report-head">
      <span class="sec-index">01</span>
      <h2>REPORT / 当日复盘</h2>
      <span class="report-tag">ARCHIVE / SECONDARY</span>
    </div>
    <article id="md"><div id="tip">正在读取日报正文…</div></article>
    <footer class="report-foot">
      <span>XAU GRID · MISSION CONTROL</span>
      <span>文字版日报 · 可复制 / 下载 .md</span>
    </footer>
  </main>
</div>

<script src="assets/js/report-core.js"></script>
<script src="assets/js/theme.js"></script>
<script src="assets/js/report-app.js"></script>
</body>
</html>
